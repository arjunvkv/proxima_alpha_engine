<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXIMA ALPHA ENGINE — Gate Diagnostics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/obsidian_terminal.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="obsidian-theme">

    <header class="top-nav">
        <div class="brand-block">
            <div class="logo-pulse"><i class="fa-solid fa-atom"></i></div>
            <div class="brand-text">
                <span class="brand-name">PROXIMA ALPHA ENGINE</span>
                <span class="brand-sub">LIVE PYTHON EXECUTION TERMINAL</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-item"><i class="fa-solid fa-chart-line"></i> Overview</a>
            <a href="/signals" class="nav-item"><i class="fa-solid fa-bolt"></i> Today's Signals</a>
            <a href="/diagnostics" class="nav-item active"><i class="fa-solid fa-microscope"></i> Diagnostics</a>
            <a href="/logs" class="nav-item"><i class="fa-solid fa-terminal"></i> Engine Logs</a>
            <a href="/analytics" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Risk & PnL</a>
            <a href="/positions" class="nav-item"><i class="fa-solid fa-list-check"></i> Positions</a>
        </nav>
        <div class="server-telemetry">
            <div class="status-indicator online" id="serverStatusDot"></div>
            <span class="status-text" id="serverStatusText">LIVE STREAMING</span>
            <span class="timestamp-clock" id="liveClock">00:00:00 UTC</span>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="section-title-bar" style="margin-bottom: 14px;">
            <h3><i class="fa-solid fa-microscope text-cyan"></i> STRATEGY GATE DIAGNOSTICS</h3>
            <span class="subtitle">Live entry gate status for all 6 Python strategies — session windows, z-score thresholds, time gates</span>
        </div>

        <div class="diagnostics-grid" id="diagnosticsGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(480px, 1fr)); gap: 16px;">
            <!-- Dynamically populated -->
        </div>
    </main>

    <script>
    const socket = io();
    const liveClock = document.getElementById('liveClock');
    const serverStatusDot = document.getElementById('serverStatusDot');
    const serverStatusText = document.getElementById('serverStatusText');
    setInterval(() => { if (liveClock) liveClock.textContent = new Date().toISOString().substring(11, 19) + ' UTC'; }, 1000);

    socket.on('connect', () => { serverStatusDot.className = 'status-indicator online'; serverStatusText.textContent = 'LIVE STREAMING'; });
    socket.on('disconnect', () => { serverStatusDot.className = 'status-indicator offline'; serverStatusText.textContent = 'DISCONNECTED'; });

    socket.on('radar_update', (data) => {
        if (!data.diagnostics) return;
        const grid = document.getElementById('diagnosticsGrid');
        grid.innerHTML = '';
        data.diagnostics.forEach(d => {
            const isOpen = d.status.includes('OPEN') || d.status.includes('MONITORING');
            const badgeClass = isOpen ? 'text-emerald' : 'text-amber';
            const icon = isOpen ? 'fa-check-circle' : 'fa-clock';
            const card = document.createElement('div');
            card.className = 'diag-card';
            card.style.cssText = `
                background: rgba(255,255,255,0.03);
                border: 1px solid rgba(255,255,255,${isOpen ? '0.12' : '0.06'});
                border-left: 3px solid ${isOpen ? 'var(--accent-emerald)' : 'var(--accent-amber)'};
                border-radius: 10px; padding: 20px; transition: all 0.3s;
            `;
            card.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;">
                    <div>
                        <div style="font-size:1rem; font-weight:700; margin-bottom:4px;">${d.name}</div>
                        <div style="font-size:0.75rem; color:var(--text-muted);">${d.primary_gate}</div>
                    </div>
                    <span style="font-size:0.72rem; font-weight:800; padding:4px 12px; border-radius:20px;
                        background:${isOpen ? 'rgba(16,185,129,0.15)' : 'rgba(245,158,11,0.12)'};
                        color:${isOpen ? 'var(--accent-emerald)' : 'var(--accent-amber)'};
                        border:1px solid ${isOpen ? 'rgba(16,185,129,0.3)' : 'rgba(245,158,11,0.3)'};">
                        <i class="fa-solid ${icon}"></i> ${isOpen ? 'GATE OPEN' : 'WAITING'}
                    </span>
                </div>
                <div style="background:rgba(0,0,0,0.3); border-radius:6px; overflow:hidden; height:8px; margin-bottom:14px;">
                    <div style="height:100%; width:${d.progress_pct}%; background:${isOpen ? 'var(--accent-emerald)' : 'var(--accent-amber)'}; transition:width 0.5s;"></div>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; font-size:0.78rem;">
                    <div>
                        <div style="color:var(--text-muted); font-size:0.68rem; margin-bottom:2px;">REQUIRED</div>
                        <div style="font-family:var(--font-mono); font-weight:600;">${d.required_threshold}</div>
                    </div>
                    <div>
                        <div style="color:var(--text-muted); font-size:0.68rem; margin-bottom:2px;">CURRENT</div>
                        <div style="font-family:var(--font-mono); font-weight:600;" class="${badgeClass}">${d.current_value}</div>
                    </div>
                </div>
                ${!isOpen ? `
                <div style="margin-top:12px; padding:8px 12px; background:rgba(245,158,11,0.07); border-radius:6px; font-size:0.75rem; color:var(--accent-amber);">
                    <i class="fa-solid fa-triangle-exclamation"></i> ${d.blockage_reason}
                </div>` : `
                <div style="margin-top:12px; padding:8px 12px; background:rgba(16,185,129,0.07); border-radius:6px; font-size:0.75rem; color:var(--accent-emerald);">
                    <i class="fa-solid fa-check"></i> Entry gate is open — monitoring for signal conditions
                </div>`}
            `;
            grid.appendChild(card);
        });
    });
    </script>
</body>
</html>
