<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXIMA ALPHA ENGINE — Engine Logs</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/obsidian_terminal.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        .log-console-wrap { background: #0a0a0a; border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; height: calc(100vh - 220px); display: flex; flex-direction: column; overflow: hidden; }
        .log-toolbar { display: flex; gap: 10px; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
        .log-toolbar span { font-size: 0.75rem; font-family: var(--font-mono); color: var(--text-muted); margin-right: auto; }
        .log-filter-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; cursor: pointer; transition: all 0.2s; }
        .log-filter-btn:hover { background: rgba(255,255,255,0.08); }
        .log-filter-btn.active { background: var(--accent-emerald); color: #000; border-color: var(--accent-emerald); }
        .log-filter-btn.error.active { background: var(--accent-rose); border-color: var(--accent-rose); }
        .log-filter-btn.warn.active { background: var(--accent-amber); color: #000; border-color: var(--accent-amber); }
        .log-body { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: var(--font-mono); font-size: 0.78rem; line-height: 1.8; }
        .log-body::-webkit-scrollbar { width: 6px; }
        .log-body::-webkit-scrollbar-track { background: transparent; }
        .log-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        .log-line { display: flex; gap: 12px; padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.02); }
        .log-line.error { background: rgba(239,68,68,0.07); border-left: 3px solid var(--accent-rose); padding-left: 8px; }
        .log-line.warn { background: rgba(245,158,11,0.05); border-left: 3px solid var(--accent-amber); padding-left: 8px; }
        .log-line.info { border-left: 3px solid var(--accent-emerald); padding-left: 8px; }
        .log-line.debug { opacity: 0.6; }
        .log-ts { color: var(--text-muted); min-width: 70px; }
        .log-sev { font-weight: 700; min-width: 55px; }
        .log-sev.error { color: var(--accent-rose); }
        .log-sev.warn { color: var(--accent-amber); }
        .log-sev.info { color: var(--accent-emerald); }
        .log-sev.debug { color: var(--text-muted); }
        .log-msg { color: var(--text-primary); flex: 1; }
        .log-count-badge { background: rgba(239,68,68,0.2); color: var(--accent-rose); border: 1px solid rgba(239,68,68,0.3); border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; font-weight: 700; font-family: var(--font-mono); }
        .auto-scroll-btn { padding: 4px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: rgba(16,185,129,0.1); color: var(--accent-emerald); font-size: 0.72rem; font-weight: 700; cursor: pointer; }
    </style>
</head>
<body class="obsidian-theme">

    <header class="top-nav">
        <div class="brand-block">
            <div class="logo-pulse"><i class="fa-solid fa-atom"></i></div>
            <div class="brand-text">
                <span class="brand-name">PROXIMA ALPHA ENGINE</span>
                <span class="brand-sub">LIVE PYTHON EXECUTION TERMINAL</span>
            </div>
        </div>
        <nav class="nav-links">
            <a href="/" class="nav-item"><i class="fa-solid fa-chart-line"></i> Overview</a>
            <a href="/trades" class="nav-item"><i class="fa-solid fa-list-check"></i> Trades</a>
            <a href="/risk" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Risk & PnL</a>
            <a href="/logs" class="nav-item active"><i class="fa-solid fa-terminal"></i> Engine Logs</a>
        </nav>
        <div class="server-telemetry">
            <div class="status-indicator online" id="serverStatusDot"></div>
            <span class="status-text" id="serverStatusText">LIVE STREAMING</span>
            <span class="timestamp-clock" id="liveClock">00:00:00 UTC</span>
        </div>
    </header>

    <main class="dashboard-container">
        <div class="section-title-bar" style="margin-bottom: 14px;">
            <h3><i class="fa-solid fa-terminal text-cyan"></i> LIVE ENGINE LOG CONSOLE</h3>
            <span class="subtitle">Real-time stdout from proxima_alpha_engine — execution failures, signals, MT5 status</span>
        </div>

        <div class="log-console-wrap">
            <div class="log-toolbar">
                <span id="logCountLabel">0 lines | 0 errors</span>
                <button class="log-filter-btn active" onclick="setFilter('ALL')">ALL</button>
                <button class="log-filter-btn error" onclick="setFilter('ERROR')">ERRORS</button>
                <button class="log-filter-btn warn" onclick="setFilter('WARN')">WARNINGS</button>
                <button class="log-filter-btn" onclick="setFilter('INFO')">SIGNALS</button>
                <button class="auto-scroll-btn" onclick="toggleAutoScroll()" id="autoScrollBtn">⬇ AUTO-SCROLL ON</button>
                <button class="log-filter-btn" onclick="clearLogs()" style="color: var(--accent-rose);">CLEAR</button>
            </div>
            <div class="log-body" id="logBody">
                <div class="log-line debug">
                    <span class="log-ts">--:--:--</span>
                    <span class="log-sev debug">SYSTEM</span>
                    <span class="log-msg">Connecting to engine log stream...</span>
                </div>
            </div>
        </div>
    </main>

    <script>
    const socket = io();
    let allLogs = [];
    let activeFilter = 'ALL';
    let autoScroll = true;
    let errorCount = 0;

    const liveClock = document.getElementById('liveClock');
    const serverStatusDot = document.getElementById('serverStatusDot');
    const serverStatusText = document.getElementById('serverStatusText');
    setInterval(() => { if (liveClock) liveClock.textContent = new Date().toISOString().substring(11, 19) + ' UTC'; }, 1000);

    socket.on('connect', () => {
        serverStatusDot.className = 'status-indicator online';
        serverStatusText.textContent = 'LIVE STREAMING';
    });
    socket.on('disconnect', () => {
        serverStatusDot.className = 'status-indicator offline';
        serverStatusText.textContent = 'DISCONNECTED';
    });

    socket.on('radar_update', (data) => {
        if (!data.vps_logs) return;
        const logs = data.vps_logs;

        // Only append new lines
        const newLines = logs.slice(allLogs.length);
        newLines.forEach(l => {
            allLogs.push(l);
            if (l.severity === 'ERROR') errorCount++;
        });

        renderLogs();
        updateCount();
    });

    function renderLogs() {
        const body = document.getElementById('logBody');
        const filtered = activeFilter === 'ALL' ? allLogs :
            activeFilter === 'INFO' ? allLogs.filter(l => l.severity === 'INFO') :
            allLogs.filter(l => l.severity === activeFilter);

        body.innerHTML = '';
        filtered.slice(-300).forEach(l => {
            const div = document.createElement('div');
            div.className = `log-line ${l.severity.toLowerCase()}`;
            div.innerHTML = `
                <span class="log-ts">${l.timestamp}</span>
                <span class="log-sev ${l.severity.toLowerCase()}">${l.severity}</span>
                <span class="log-msg">${escapeHtml(l.raw)}</span>
            `;
            body.appendChild(div);
        });

        if (autoScroll) body.scrollTop = body.scrollHeight;
    }

    function updateCount() {
        document.getElementById('logCountLabel').textContent =
            `${allLogs.length} lines | ${errorCount} errors`;
    }

    function setFilter(f) {
        activeFilter = f;
        document.querySelectorAll('.log-filter-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderLogs();
    }

    function toggleAutoScroll() {
        autoScroll = !autoScroll;
        document.getElementById('autoScrollBtn').textContent = autoScroll ? '⬇ AUTO-SCROLL ON' : '⬇ AUTO-SCROLL OFF';
    }

    function clearLogs() { allLogs = []; errorCount = 0; renderLogs(); updateCount(); }

    function escapeHtml(s) {
        return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
    </script>
</body>
</html>
